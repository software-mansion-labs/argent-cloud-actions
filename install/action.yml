name: Install sim-remote
description: >-
  Install the sim-remote CLI (the Argent Cloud client) and add it to PATH.
  Taking a fleet machine is the acquire action's job.
author: Software Mansion

inputs:
  releases-url:
    description: >-
      Base URL of the sim-remote releases. The latest published release is
      always installed, from `<releases-url>/latest/download/sim-remote-<target>`.
    required: false
    default: https://github.com/software-mansion/sim-remote-releases/releases

outputs:
  sim-remote-path:
    description: Absolute path of the installed CLI.
  install-dir:
    description: Directory added to PATH, holding the CLI.

runs:
  using: node24
  main: main.js

branding:
  icon: download
  color: purple
