name: Acquire an Argent Cloud machine
description: >-
  Log in to sim-router and take a machine from the fleet for this job. The
  machine is released automatically when the job ends. Needs sim-remote on
  PATH — run the install action first.
author: Software Mansion

inputs:
  api-key:
    description: >-
      sim-router API key, to log in as the user it belongs to. Pass a secret,
      never a literal. Give either this or `label`.
    required: false
    default: ''
  label:
    description: >-
      Log in as this workflow instead, with the OIDC id token GitHub mints for
      the job: the label is the name the workflow is registered under on the
      router, which decides the tenant and the repository and workflow file it
      admits. The job needs `permissions: id-token: write`. Give either this or
      `api-key`.
    required: false
    default: ''
  acquire:
    description: >-
      Take a machine after logging in. Set to false to log in only — for a job
      that attaches to a machine it already holds.
    required: false
    default: 'true'
  timeout:
    description: >-
      Seconds a single acquire waits for a free machine. The router clamps
      this to its own maximum, which is why waiting longer is done by retrying
      rather than by raising this.
    required: false
    default: '300'
  retries:
    description: How many acquire attempts to make before giving up.
    required: false
    default: '8'
  retry-delay:
    description: Seconds to wait between acquire attempts.
    required: false
    default: '30'
  release:
    description: >-
      Release the machine (by logging out) in the post step. Set to false only
      when a later job in the same run is meant to inherit the session.
    required: false
    default: 'true'
  sim-remote-path:
    description: >-
      Path to the CLI. Defaults to whatever `sim-remote` resolves to on PATH,
      which is what the install action puts there.
    required: false
    default: ''

runs:
  using: node24
  main: main.js
  post: post.js
  post-if: always()

branding:
  icon: smartphone
  color: purple
