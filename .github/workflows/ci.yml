name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint workflows and actions
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:latest -color

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          # Matches the actions' own runtime (`using: node24`), so a syntax
          # or API difference shows up here rather than on a consumer's runner.
          node-version: '24'
      - run: node --test

  # Installing needs no credentials, which is what makes it checkable here:
  # it proves the asset for this runner exists, downloads, runs, and lands on
  # PATH. Acquiring needs a fleet machine, so it lives in e2e.yml.
  install:
    name: Install (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install sim-remote
        id: install
        uses: ./install

      - name: Check the CLI is on PATH and runs
        run: |
          command -v sim-remote
          sim-remote --help > /dev/null
          test -x "${{ steps.install.outputs.sim-remote-path }}"

      # The acquire action must name the install action as the fix when the
      # CLI is missing, rather than failing with a bare ENOENT.
      - name: Check acquire reports a missing CLI clearly
        env:
          INPUT_USERNAME: ci-nobody
          INPUT_API-KEY: not-a-key
        run: |
          # A PATH with node on it but no sim-remote, which is exactly the
          # state of a job that forgot the install action.
          BARE_PATH="$(dirname "$(command -v node)"):/usr/bin:/bin"

          if PATH="$BARE_PATH" node acquire/main.js > out.log 2>&1; then
            echo "acquire succeeded without sim-remote installed"
            cat out.log
            exit 1
          fi
          grep -q "run the install action first" out.log

  # The local `uses: ./install` above cannot prove the one thing a consumer
  # depends on: that a `owner/repo/subdir@ref` reference brings the whole
  # repository with it, so the action's `require('../lib/lib.js')` resolves.
  # This job references the published tag the way a consumer would.
  published:
    name: Published reference
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: software-mansion-labs/argent-cloud-actions/install@v1
      - run: sim-remote --help > /dev/null
